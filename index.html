<body class="font-sans antialiased relative min-h-screen">
    
    <!-- 背景動態磨砂光暈球體 -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
        <div class="absolute top-[-10%] left-[-10%] w-[55vw] h-[55vw] rounded-full bg-purple-600/15 mix-blend-screen filter blur-[170px] opacity-50 animate-blob"></div>
        <div class="absolute top-[25%] right-[-10%] w-[50vw] h-[50vw] rounded-full bg-indigo-600/15 mix-blend-screen filter blur-[170px] opacity-50 animate-blob" style="animation-delay: 7s"></div>
        <div class="absolute bottom-[-25%] left-[10%] w-[75vw] h-[75vw] rounded-full bg-blue-600/35 mix-blend-screen filter blur-[150px] opacity-40 animate-blob" style="animation-duration: 20s; animation-delay: 3s;"></div>
    </div>

    <div id="root" class="relative z-10"></div>

    <script type="text/babel" data-type="module">
        const { useState, useEffect, useMemo, useCallback, useRef, useDeferredValue } = React;
        const { AreaChart, Area, LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, ReferenceDot } = window.Recharts; 

        // 破產紅點元件
        const CustomReferenceDot = (props) => {
            const { cx, cy, hitZeroAge } = props;
            if (cx === undefined || cy === undefined || hitZeroAge === null) return null;

            return (
                <g style={{ zIndex: 9999 }}>
                    <circle cx={cx} cy={cy} r={6} fill="#ef4444" stroke="#ffffff" strokeWidth={1.5} filter="drop-shadow(0px 0px 6px rgba(239,68,68,0.9))"/>
                    <text x={cx} y={cy - 41} fill="#ef4444" fontSize={13} fontWeight="bold" textAnchor="middle" style={{textShadow: '0 2px 8px rgba(0,0,0,0.95), 0 0 4px rgba(0,0,0,0.9)'}}>
                        <tspan x={cx} dy="0">{hitZeroAge} 歲</tspan>
                        <tspan x={cx} dy="1.3em">時破產</tspan>
                    </text>
                </g>
            );
        };

        // 財務自由黃點元件
        const CustomFIReferenceDot = (props) => {
            const { cx, cy, hitFIAge } = props;
            if (cx === undefined || cy === undefined || hitFIAge === null) return null;

            return (
                <g style={{ zIndex: 9999 }}>
                    <circle cx={cx} cy={cy} r={6} fill="#fbbf24" stroke="#ffffff" strokeWidth={1.5} filter="drop-shadow(0px 0px 6px rgba(251,191,36,0.9))"/>
                    <text x={cx} y={cy - 41} fill="#fbbf24" fontSize={13} fontWeight="bold" textAnchor="middle" style={{textShadow: '0 2px 8px rgba(0,0,0,0.95), 0 0 4px rgba(0,0,0,0.9)'}}>
                        <tspan x={cx} dy="0">財務自由</tspan>
                        <tspan x={cx} dy="1.3em">({hitFIAge} 歲)</tspan>
                    </text>
                </g>
            );
        };

        const gaussian = (prng) => {
            let u = prng(), v = prng();
            if (u === 0) u = 1e-4; if (v === 0) v = 1e-4;
            return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
        };
        // 對數常態 + 厚尾(t, ν=5)：年均預期報酬 = mean%，不會低於 -100%，且左尾比常態分布更肥
        const drawReturn = (prng, mean, sigma) => {
            const nu = 5; let chi = 0;
            for (let k = 0; k < nu; k++) { const g = gaussian(prng); chi += g * g; }
            let tv = gaussian(prng) / Math.sqrt(chi / nu) * Math.sqrt((nu - 2) / nu);
            tv = Math.max(-4, Math.min(4, tv));
            const mu = 1 + mean / 100;
            const s2 = Math.log(1 + Math.pow(sigma / 100 / mu, 2));
            return (Math.exp(Math.log(mu) - s2 / 2 + Math.sqrt(s2) * tv) - 1) * 100;
        };

        function RetirementCalculator() {
            const [workStatus, setWorkStatus] = useState('working'); 
            const [currentAge, setCurrentAge] = useState(30);
            const [retireAge, setRetireAge] = useState(65);
            const [lifeExpectancy, setLifeExpectancy] = useState(95);

            const [netWorth, setNetWorth] = useState(3000000);
            const [monthlyExpense, setMonthlyExpense] = useState(30000);
            const [annualIncome, setAnnualIncome] = useState(660000);
            const [enablePension, setEnablePension] = useState(false);
            const [pensionMonthly, setPensionMonthly] = useState(0);
            const [pensionStartAge, setPensionStartAge] = useState(65);
            const [currency, setCurrency] = useState('NT$');

            const [investmentReturn, setInvestmentReturn] = useState(7);
            const [inflationRate, setInflationRate] = useState(3);
            
            // 是否開啟隨機浮動 (對應 擬真浮動)
            const [enableRandomFloat, setEnableRandomFloat] = useState(false);
            const [randomSeed, setRandomSeed] = useState(Date.now());
            // 報酬率模式：'p25', 'p50', 'p75'
            const [returnMode, setReturnMode] = useState('p50');
            // 波動度級距：'low' (5%), 'mid' (10%), 'high' (15%)
            const [volatilityLevel, setVolatilityLevel] = useState('high');

            const [currencyType, setCurrencyType] = useState('today');
            const [activeTab, setActiveTab] = useState('netWorth');
            const [incomeViewType, setIncomeViewType] = useState('annual');

            const [netWorthStr, setNetWorthStr] = useState('3,000,000');
            const [monthlyExpenseStr, setMonthlyExpenseStr] = useState('30,000');
            const [annualIncomeStr, setAnnualIncomeStr] = useState('660,000');
            const [pensionMonthlyStr, setPensionMonthlyStr] = useState('');
            const [investmentReturnStr, setInvestmentReturnStr] = useState('7');
            const [inflationRateStr, setInflationRateStr] = useState('3');

            const [keepGrowingExpense, setKeepGrowingExpense] = useState(false);
            const [keepGrowingNetWorth, setKeepGrowingNetWorth] = useState(false);
            const annualSavings = (annualIncome === '' || monthlyExpense === '') ? '' : Number(annualIncome) - Number(monthlyExpense) * 12;
            const rateChange = (setNum, setStr) => (e) => {
                const raw = e.target.value.replace(/[^\d.\-]/g, '').replace(/(?!^)-/g, '').replace(/(\..*)\./g, '$1').slice(0, 6);
                setStr(raw);
                const n = parseFloat(raw);
                setNum(isNaN(n) ? '' : Math.min(Math.max(n, -20), 30));
            };

            const formatNumber = (num) => {
                if (num === null || num === undefined || num === '') return '';
                const isNegative = num < 0;
                const absStr = Math.abs(Number(num)).toLocaleString('en-US');
                return isNegative ? `-${absStr}` : absStr;
            };

            const formatCurrencyText = (num) => {
                if (num === null || num === undefined) return currency + '0';
                const isNeg = num < 0;
                const absVal = Math.abs(num);
                return `${isNeg ? '-' : ''}${currency}${formatNumber(absVal)}`;
            };

            // 自動平衡：收入固定時，開銷越高儲蓄越少，因此用封閉解直接求出不振盪的結果
            useEffect(() => {
                if (enableRandomFloat || (!keepGrowingNetWorth && !keepGrowingExpense)) return;
                const r = (1 + Number(investmentReturn) / 100) / (1 + Number(inflationRate) / 100) - 1;
                if (!(r > 0)) { setKeepGrowingNetWorth(false); setKeepGrowingExpense(false); return; }
                const working = workStatus === 'working' && retireAge > currentAge;
                const n = working ? retireAge - currentAge : 0;
                const A = Math.pow(1 + r, n);
                const F = working ? (1 + r) * (A - 1) / r : 0;
                const I = working ? (Number(annualIncome) || 0) : 0;
                const startAge = working ? Number(retireAge) : Number(currentAge);
                const pen = enablePension && Number(pensionStartAge) <= startAge ? (Number(pensionMonthly) || 0) * 12 : 0;
                if (keepGrowingNetWorth) {
                    const Ey = Number(monthlyExpense) * 12;
                    const wRetire = Math.max(0, Ey - pen) * (1 + r) / r;
                    const req = working ? (wRetire - (I - Ey) * F) / A : wRetire;
                    const target = Math.ceil(Math.max(0, req));
                    if (netWorth !== target) { setNetWorth(target); setNetWorthStr(formatNumber(target)); }
                } else {
                    const k = r / (1 + r);
                    const Ey = working ? (k * (Number(netWorth) * A + I * F) + pen) / A : k * Number(netWorth) + pen;
                    const target = Math.floor(Math.max(0, Ey / 12));
                    if (monthlyExpense !== target) { setMonthlyExpense(target); setMonthlyExpenseStr(formatNumber(target)); }
                }
            }, [keepGrowingNetWorth, keepGrowingExpense, monthlyExpense, netWorth, investmentReturn, inflationRate, workStatus, annualIncome, enablePension, pensionMonthly, pensionStartAge, currentAge, retireAge, enableRandomFloat]);

            const handleNetWorthChange = (e) => {
                setKeepGrowingNetWorth(false);
                const rawValue = e.target.value.replace(/\D/g, '');
                if (rawValue !== '') {
                    const numValue = parseInt(rawValue, 10);
                    setNetWorth(numValue);
                    setNetWorthStr(formatNumber(numValue));
                } else {
                    setNetWorth('');
                    setNetWorthStr('');
                }
            };

            const handleMonthlyExpenseChange = (e) => {
                setKeepGrowingExpense(false);
                const rawValue = e.target.value.replace(/\D/g, '');
                if (rawValue !== '') {
                    const numValue = parseInt(rawValue, 10);
                    setMonthlyExpense(numValue);
                    setMonthlyExpenseStr(formatNumber(numValue));
                } else {
                    setMonthlyExpense('');
                    setMonthlyExpenseStr('');
                }
            };

            const handleAnnualIncomeChange = (e) => {
                setKeepGrowingExpense(false);
                setKeepGrowingNetWorth(false);
                const raw = e.target.value.replace(/\D/g, '');
                if (raw !== '') { const v = parseInt(raw, 10); setAnnualIncome(v); setAnnualIncomeStr(formatNumber(v)); }
                else { setAnnualIncome(''); setAnnualIncomeStr(''); }
            };

            const handlePensionChange = (e) => {
                const raw = e.target.value.replace(/\D/g, '');
                if (raw !== '') { const v = parseInt(raw, 10); setPensionMonthly(v); setPensionMonthlyStr(formatNumber(v)); }
                else { setPensionMonthly(0); setPensionMonthlyStr(''); }
            };

            const formatYAxis = (tickItem) => {
                if (tickItem === 0) return currency + '0';
                const absVal = Math.abs(tickItem);
                const sign = tickItem < 0 ? '-' : '';
                if (absVal >= 100000000) {
                    const billionVal = absVal / 100000000;
                    return `${sign}${currency}${parseFloat(billionVal.toFixed(1))}億`;
                }
                return `${sign}${currency}${formatNumber(absVal / 10000)}萬`;
            };

            const mulberry32 = (a) => {
                return function() {
                    let t = a += 0x6D2B79F5;
                    t = Math.imul(t ^ t >>> 15, t | 1);
                    t ^= t + Math.imul(t ^ t >>> 7, t | 61);
                    return ((t ^ t >>> 14) >>> 0) / 4294967296;
                }
            };

            const simulateChart = useCallback((testExpense, testNetWorth) => {
                const nw = testNetWorth !== undefined ? testNetWorth : netWorth;
                const exp = testExpense !== undefined ? testExpense : monthlyExpense;

                if (currentAge === '' || lifeExpectancy === '' || nw === '' || exp === '' || investmentReturn === '' || inflationRate === '' || (workStatus === 'working' && annualSavings === '') || Number(lifeExpectancy) <= Number(currentAge)) {
                    return { data: [], hitZeroAge: null, hitFIAge: null, mcSuccessRate: null };
                }

                let data = [];
                let currentWorth = Number(nw);
                const baseRet = Number(investmentReturn);
                const infRate = Number(inflationRate);
                const mthExp = Number(exp);
                const curAge = Number(currentAge);
                const lifeExp = Number(lifeExpectancy);
                const retAge = Number(retireAge);
                const penYear = enablePension ? (Number(pensionMonthly) || 0) * 12 : 0;
                const penAge = pensionStartAge === '' ? 65 : Number(pensionStartAge);
                const annSav = Number(annualSavings);

                const yearlyExpense = mthExp * 12;
                const startAge = curAge;
                const endAge = lifeExp;
                let hitZeroAge = null;
                let hitFIAge = null;

                let accLabor = 0;
                let accCapital = 0;
                let accExpense = 0;

                let prevEffectiveRet = null;
                let prevLabor = 0;
                let prevCap = 0;
                let prevExp = 0;
                let prevWorthForDiff = Number(nw);

                if (!enableRandomFloat) {
                    for (let age = startAge; age <= endAge; age++) {
                        const yearIdx = age - startAge;
                        const pen = age >= penAge ? penYear : 0;

                        const roundedWorth = Math.max(0, Math.round(currentWorth));
                        const netChange = age === startAge ? 0 : roundedWorth - prevWorthForDiff;

                        data.push({ 
                            age: age, 
                            netWorth: roundedWorth,
                            netChange: netChange,
                            yearlyReturnRate: age === startAge ? null : prevEffectiveRet,
                            laborIncome: age === startAge ? 0 : prevLabor,
                            capitalIncome: age === startAge ? 0 : prevCap,
                            expense: age === startAge ? 0 : prevExp,
                            accLabor: accLabor,
                            accCapital: accCapital,
                            accExpense: accExpense
                        });
                        
                        prevWorthForDiff = roundedWorth;

                        if (hitZeroAge === null && roundedWorth <= 0 && age > startAge) {
                            hitZeroAge = age;
                        }
                        if (hitFIAge === null && age > startAge && prevCap >= prevExp && roundedWorth > 0) {
                            hitFIAge = age;
                        }

                        const realReturnRate = (1 + baseRet / 100) / (1 + infRate / 100) - 1;
                        let currentExp = 0, currentLabor = pen, currentCap = 0;

                        if (currencyType === 'today') {
                            currentCap = currentWorth > 0 ? currentWorth * realReturnRate : 0;
                            currentExp = yearlyExpense;
                            if (workStatus === 'working' && age < retAge) {
                                currentLabor = yearlyExpense + annSav + pen;
                                currentWorth = (currentWorth + annSav + pen) * (1 + realReturnRate);
                            } else {
                                currentWorth = (currentWorth - yearlyExpense + pen) * (1 + realReturnRate);
                            }
                        } else {
                            const infMultiplier = Math.pow(1 + infRate / 100, yearIdx);
                            currentExp = yearlyExpense * infMultiplier;
                            currentLabor = pen * infMultiplier;
                            currentCap = currentWorth > 0 ? currentWorth * (baseRet / 100) : 0;
                            
                            if (workStatus === 'working' && age < retAge) {
                                currentLabor = (yearlyExpense + annSav + pen) * infMultiplier;
                                const futureSavings = annSav * infMultiplier;
                                currentWorth = (currentWorth + futureSavings + pen * infMultiplier) * (1 + baseRet / 100);
                            } else {
                                const futureYearlyExpense = yearlyExpense * infMultiplier;
                                currentWorth = (currentWorth - futureYearlyExpense + pen * infMultiplier) * (1 + baseRet / 100);
                            }
                        }

                        accLabor += Math.round(currentLabor);
                        accCapital += Math.round(currentCap);
                        accExpense += Math.round(currentExp);
                        
                        prevEffectiveRet = Number(baseRet.toFixed(2));
                        prevLabor = Math.round(currentLabor);
                        prevCap = Math.round(currentCap);
                        prevExp = Math.round(currentExp);
                    }
                    return { data, hitZeroAge, hitFIAge, mcSuccessRate: null };
                }

                // --- 蒙地卡羅引擎 ---
                const prng = mulberry32(randomSeed);
                const iterations = 1000;
                let allSims = [];
                let successCount = 0;
                
                const sigmaMap = { low: 5, mid: 10, high: 15 };
                const sigma = sigmaMap[volatilityLevel] || 15;

                for (let i = 0; i < iterations; i++) {
                    let tempWorth = nw;
                    let returns = [];
                    let netWorths = [];
                    let localHitZero = null;

                    for (let age = startAge; age <= endAge; age++) {
                        const yearIdx = age - startAge;
                        const pen = age >= penAge ? penYear : 0;
                        const effectiveRet = drawReturn(prng, baseRet, sigma);
                        returns.push(effectiveRet);

                        if (tempWorth <= 0) {
                            if (localHitZero === null) localHitZero = age;
                        }

                        const realReturnRate = (1 + effectiveRet / 100) / (1 + infRate / 100) - 1;
                        if (currencyType === 'today') {
                            if (workStatus === 'working' && age < retAge) {
                                tempWorth = (tempWorth + annSav + pen) * (1 + realReturnRate);
                            } else {
                                tempWorth = (tempWorth - yearlyExpense + pen) * (1 + realReturnRate);
                            }
                        } else {
                            const infMultiplier = Math.pow(1 + infRate / 100, yearIdx);
                            if (workStatus === 'working' && age < retAge) {
                                const futureSavings = annSav * infMultiplier;
                                tempWorth = (tempWorth + futureSavings + pen * infMultiplier) * (1 + effectiveRet / 100);
                            } else {
                                const futureYearlyExpense = yearlyExpense * infMultiplier;
                                tempWorth = (tempWorth - futureYearlyExpense + pen * infMultiplier) * (1 + effectiveRet / 100);
                            }
                        }
                        netWorths.push(tempWorth);
                    }

                    if (tempWorth > 0) successCount++;
                    allSims.push({

                        returns: returns,
                        netWorths: netWorths
                    });

                    if (a.finalWorth <= 0 && b.finalWorth <= 0) return a.hitZeroAge - b.hitZeroAge;
                    return a.finalWorth - b.finalWorth;
                });

                const computedMcRate = ((successCount / iterations) * 100).toFixed(1);

                let selectedIndex = 500; 
                if (returnMode === 'p25') selectedIndex = 250;
                if (returnMode === 'p75') selectedIndex = 750;
                const repSim = allSims[selectedIndex];

                for (let age = startAge; age <= endAge; age++) {
                    const yearIdx = age - startAge;
                        const pen = age >= penAge ? penYear : 0;
                    const effectiveRet = repSim.returns[yearIdx];

                    const roundedWorth = Math.max(0, Math.round(currentWorth));
                    const netChange = age === startAge ? 0 : roundedWorth - prevWorthForDiff;

                    data.push({ 
                        age: age, 
                        netWorth: roundedWorth,
                        netChange: netChange,
                        yearlyReturnRate: age === startAge ? null : prevEffectiveRet,
                        laborIncome: age === startAge ? 0 : prevLabor,
                        capitalIncome: age === startAge ? 0 : prevCap,
                        expense: age === startAge ? 0 : prevExp,
                        accLabor: accLabor,
                        accCapital: accCapital,
                        accExpense: accExpense
                    });
                    
                    prevWorthForDiff = roundedWorth;

                    let stepWorths = allSims.map(s => Math.max(0, s.netWorths[yearIdx]));
                    stepWorths.sort((a,b) => a - b);
                    data[data.length - 1].netWorthRange = [Math.round(stepWorths[250]), Math.round(stepWorths[750])];

                    if (hitZeroAge === null && roundedWorth <= 0 && age > startAge) {
                        hitZeroAge = age;
                    }
                    if (hitFIAge === null && age > startAge && prevCap >= prevExp && roundedWorth > 0) {
                        hitFIAge = age;

                    const realReturnRate = (1 + effectiveRet / 100) / (1 + infRate / 100) - 1;
                    let currentExp = 0, currentLabor = pen, currentCap = 0;

                    if (currencyType === 'today') {
                        currentCap = currentWorth > 0 ? currentWorth * realReturnRate : 0;
                        currentExp = yearlyExpense;
                        if (workStatus === 'working' && age < retAge) {
                            currentLabor = yearlyExpense + annSav + pen;
                            currentWorth = (currentWorth + annSav + pen) * (1 + realReturnRate);
                        } else {
                            currentWorth = (currentWorth - yearlyExpense + pen) * (1 + realReturnRate);
                        }
                    } else {
                        const infMultiplier = Math.pow(1 + infRate / 100, yearIdx);
                        currentExp = yearlyExpense * infMultiplier;
                            currentLabor = pen * infMultiplier;
                        currentCap = currentWorth > 0 ? currentWorth * (effectiveRet / 100) : 0;
                        
                        if (workStatus === 'working' && age < retAge) {
                            currentLabor = (yearlyExpense + annSav + pen) * infMultiplier;
                            const futureSavings = annSav * infMultiplier;
                            currentWorth = (currentWorth + futureSavings + pen * infMultiplier) * (1 + effectiveRet / 100);
                        } else {
                            const futureYearlyExpense = yearlyExpense * infMultiplier;
                            currentWorth = (currentWorth - futureYearlyExpense + pen * infMultiplier) * (1 + effectiveRet / 100);
                        }

                    accCapital += Math.round(currentCap);
                    accExpense += Math.round(currentExp);
                    
                    prevEffectiveRet = Number(effectiveRet.toFixed(2));
                    prevLabor = Math.round(currentLabor);
                    prevCap = Math.round(currentCap);
                    prevExp = Math.round(currentExp);
                }

                return { data, hitZeroAge: repSim.hitZeroAge, hitFIAge, mcSuccessRate: computedMcRate };

                                            <span className="w-2.5 h-2.5 rounded-full shadow-[0_0_8px_rgba(96,165,250,0.8)]" style={{ backgroundColor: '#60a5fa' }}></span>
                                            <span className="text-sm font-medium text-slate-300">{incomeViewType === 'cumulative' ? '累積資本所得' : '資本所得 (含虧損)'}</span>
                                        </div>
                                        <div className="flex items-center gap-2">
                                            <span className="w-2.5 h-2.5 rounded-full shadow-[0_0_8px_rgba(251,113,133,0.8)]" style={{ backgroundColor: '#fb7185' }}></span>
                                            <span className="text-sm font-medium text-slate-300">{incomeViewType === 'cumulative' ? '累積日常支出' : '日常支出'}</span>
                                        </div>
                                    </div>

                                    <div className="flex flex-wrap items-center gap-3">
                                        <div className="flex bg-black/40 rounded-lg border border-white/10 p-1 shadow-inner">
                                            <button 
                                                className={`px-4 py-1.5 rounded-md text-xs font-medium transition-all ${currencyType === 'today' ? 'bg-white/10 text-white shadow-sm border border-white/10' : 'text-slate-400 hover:text-slate-200 hover:bg-white/5'}`}
                                                onClick={() => setCurrencyType('today')}
                                            >
                                                今天幣值
                                            </button>
                                            <button 
                                                className={`px-4 py-1.5 rounded-md text-xs font-medium transition-all ${currencyType === 'future' ? 'bg-white/10 text-white shadow-sm border border-white/10' : 'text-slate-400 hover:text-slate-200 hover:bg-white/5'}`}
                                                onClick={() => setCurrencyType('future')}
                                            >
                                                未來幣值
                                            </button>
                                        </div>
                                        <div className="flex bg-black/40 rounded-lg border border-white/10 p-1 shadow-inner">
                                            <button 
                                                className={`px-4 py-1.5 rounded-md text-xs font-medium transition-all ${incomeViewType === 'annual' ? 'bg-white/10 text-white shadow-sm border border-white/10' : 'text-slate-400 hover:text-slate-200 hover:bg-white/5'}`}
                                                onClick={() => setIncomeViewType('annual')}
                                            >
                                                年度視角
                                            </button>
                                            <button 
                                                className={`px-4 py-1.5 rounded-md text-xs font-medium transition-all ${incomeViewType === 'cumulative' ? 'bg-white/10 text-white shadow-sm border border-white/10' : 'text-slate-400 hover:text-slate-200 hover:bg-white/5'}`}
                                                onClick={() => setIncomeViewType('cumulative')}
                                            >
                                                生涯累積視角
                                            </button>
                                        </div>
                                    </div>
                                </div>

                                <div className="h-[450px] w-full relative z-10">
                                    {chartData.length > 0 ? (
                                        <ResponsiveContainer width="100%" height="100%">
                                            <LineChart data={chartData} margin={{ top: 35, right: 30, left: 20, bottom: 20 }}>
                                                <CartesianGrid strokeDasharray="4 4" vertical={false} stroke="rgba(255,255,255,0.15)" />
                                                <XAxis 
                                                    dataKey="age" 
                                                    tick={{ fill: '#94a3b8', fontSize: 12 }}
                                                    tickLine={false}
                                                    axisLine={{ stroke: 'rgba(255,255,255,0.1)' }}
                                                    dy={10}
                                                    label={{ value: '年齡', position: 'insideBottom', offset: -15, fill: '#64748b', fontSize: 12 }}
                                                />
                                                <YAxis 
                                                    tickCount={15}
                                                    tickFormatter={formatYAxis} 
                                                    tick={{ fill: '#94a3b8', fontSize: 12, fontFamily: 'monospace' }}
                                                    tickLine={false}
                                                    axisLine={false}
                                                    dx={-10}
                                                />
                                                <Tooltip 
                                                    formatter={(value, name) => [formatCurrencyText(value), name]}
                                                    labelFormatter={(label) => `${label} 歲`}
                                                    contentStyle={{ 
                                                        backgroundColor: 'rgba(15, 23, 42, 0.85)', 
                                                        backdropFilter: 'blur(12px)',
                                                        borderColor: 'rgba(255,255,255,0.1)', 
                                                        borderRadius: '12px', 
                                                        color: '#f8fafc', 
                                                        boxShadow: '0 10px 25px -5px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255,255,255,0.1)',
                                                        border: '1px solid rgba(255,255,255,0.1)'
                                                    }}
                                                />
                                                <Line 
                                                    type="monotone" 
                                                    dataKey={incomeViewType === 'cumulative' ? 'accLabor' : 'laborIncome'} 
                                                    name={incomeViewType === 'cumulative' ? '累積稅後收入' : '稅後收入（含退休收入）'} 
                                                    stroke="#34d399" 
                                                    strokeWidth={3} 
                                                    dot={false} 
                                                    activeDot={{ r: 6, fill: '#10b981', stroke: '#fff', strokeWidth: 2 }} 
                                                />
                                                <Line 
                                                    type="monotone" 
                                                    dataKey={incomeViewType === 'cumulative' ? 'accCapital' : 'capitalIncome'} 
                                                    name={incomeViewType === 'cumulative' ? '累積資本所得' : '資本所得 (含虧損)'} 
                                                    stroke="#60a5fa" 
                                                    strokeWidth={3} 
                                                    dot={false} 
                                                    activeDot={{ r: 6, fill: '#3b82f6', stroke: '#fff', strokeWidth: 2 }} 
                                                />
                                                <Line 
                                                    type="monotone" 
                                                    dataKey={incomeViewType === 'cumulative' ? 'accExpense' : 'expense'} 
                                                    name={incomeViewType === 'cumulative' ? '累積日常支出' : '日常支出'} 
                                                    stroke="#fb7185" 
                                                    strokeWidth={3} 
                                                    strokeDasharray="6 6" 
                                                    dot={false} 
                                                    activeDot={{ r: 6, fill: '#e11d48', stroke: '#fff', strokeWidth: 2 }} 
                                                />
                                                
                                                {incomeViewType === 'annual' && hitFIAge !== null && chartData.find(d => d.age === hitFIAge) && (
                                                    <ReferenceDot 
                                                        x={hitFIAge} 
                                                        y={chartData.find(d => d.age === hitFIAge).capitalIncome} 
                                                        shape={<CustomFIReferenceDot hitFIAge={hitFIAge} />}
                                                    />
                                                )}
                                            </LineChart>
                                        </ResponsiveContainer>
                                    ) : (
                                        <div className="w-full h-full flex flex-col items-center justify-center text-slate-500 border border-dashed border-white/10 rounded-2xl bg-black/20">
                                            <span>請在上方輸入所有數值以檢視圖表</span>
                                        </div>
                                    )}
                                </div>

                                {/* 生涯花費總覽與財富軌跡總結 */}
                                <div className="mt-6 p-4 md:p-5 rounded-2xl bg-white/5 border border-white/10 backdrop-blur-md shadow-inner">
                                    <h3 className="text-sm font-semibold text-brand-300 mb-1.5 flex items-center gap-2">
                                        <span className="w-2 h-2 rounded-full bg-brand-400"></span>
                                        生涯花費與財富軌跡總覽
                                    </h3>
                                    <p className="text-xs md:text-sm text-slate-300/90 leading-relaxed font-light">
                                        在您規劃的整體生涯期間，預計總共透過工作與退休後固定收入賺取 <strong className="text-emerald-400 font-medium">{formatCurrencyText(lifetimeSummary.totalLabor)}</strong> 的稅後收入（含退休收入），透過複利投資滾出 <strong className="text-blue-400 font-medium">{formatCurrencyText(lifetimeSummary.totalCapital)}</strong> 的資本所得，而一生的總日常支出預計為 <strong className="text-rose-400 font-medium">{formatCurrencyText(lifetimeSummary.totalExpense)}</strong>。
                                    </p>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* 頁尾免責聲明與版權宣告（彼此等距、緊湊底部） */}
                    <footer className="text-center text-[11px] text-slate-400 space-y-0.5 font-light leading-normal pb-2 md:pb-0">
                        <p>免責聲明：本計算器僅供財務規劃與教育參考，所有模擬均基於數學模型與假設數據（如年化報酬、通膨）。不構成具體投資建議。</p>
                        <p>© 2026 Snap Retire by <a href="https://lanzul.com" target="_blank" rel="noopener noreferrer" className="underline text-inherit hover:text-slate-300 transition-colors">lanzul</a>. All rights reserved.</p>
                    </footer>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<RetirementCalculator />);
    </script>
</body>
</html>
